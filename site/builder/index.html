<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0A0B">
<meta name="robots" content="noindex, nofollow">
<title>Venu — Partner Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0B; --surface:#141417; --surface2:#1D1D21; --line:#2A2A2F;
    --ink:#F5F3EE; --muted:#8E8E97; --dim:#C9C9D2; --accent:#E4032E; --accent-soft:rgba(228,3,46,.12);
    --gold:#F2B01E; --ok:#4CC26B;
    --display:'Anton',sans-serif; --body:'Inter',-apple-system,system-ui,sans-serif; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;min-height:100dvh;}
  button{font-family:var(--body);cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:var(--body);}
  a{color:var(--accent);text-decoration:none;}

  /* ---------- Login gate ---------- */
  #login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:22px;
    background:radial-gradient(90% 60% at 50% -10%,rgba(228,3,46,.20),transparent 60%),var(--bg);}
  .login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 26px;}
  .brand{font-family:var(--display);font-size:34px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:10px;}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);}
  .login-card .kick{font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
  .login-card h1{font-size:18px;font-weight:700;margin:16px 0 4px;}
  .login-card p.sub{color:var(--muted);font-size:13px;margin-bottom:18px;}
  .fld{margin-bottom:12px;}
  .fld label{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
  .fld input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 13px;color:var(--ink);font-size:15px;}
  .fld input:focus{outline:none;border-color:var(--accent);}
  .login-card button.go{width:100%;background:var(--accent);color:#fff;font-weight:700;border-radius:11px;padding:13px;font-size:15px;margin-top:6px;}
  .err{color:var(--accent);font-size:13px;font-weight:600;margin-top:10px;min-height:18px;text-align:center;}
  .login-foot{margin-top:16px;text-align:center;}
  .login-foot a{color:var(--muted);font-size:12px;}

  /* ---------- App ---------- */
  #app{display:none;max-width:760px;margin:0 auto;padding:20px 18px 150px;}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px;border-bottom:1px solid var(--line);margin-bottom:8px;}
  header.top .who{font-size:13px;color:var(--muted);}
  header.top .who b{color:var(--ink);}
  header.top .who .role{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(228,3,46,.4);border-radius:6px;padding:2px 7px;margin-left:6px;}
  header.top button.out{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:8px 12px;}

  h2.sec{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:26px 0 4px;}
  .sec-note{color:var(--muted);font-size:12.5px;margin-bottom:14px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tpl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;transition:border-color .15s,background .15s;}
  .tpl.active{border-color:var(--accent);background:linear-gradient(var(--accent-soft),transparent 70%),var(--surface);}
  .tpl .nm{font-weight:700;font-size:14px;}
  .tpl .ds{color:var(--muted);font-size:11.5px;margin-top:2px;}

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .field{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;}
  .field.full{grid-column:1/-1;}
  .field label{display:block;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
  .field input{width:100%;background:none;border:none;color:var(--ink);font-size:15px;font-weight:600;outline:none;}

  .cat-h{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:20px 0 8px;}
  .feat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:border-color .15s;}
  .feat.on{border-color:rgba(228,3,46,.45);}
  .feat.locked{opacity:.5;}
  .feat .info{flex:1;}
  .feat .info .nm{font-weight:600;font-size:14px;}
  .feat .info .ds{color:var(--muted);font-size:12px;margin-top:1px;}
  .feat .price{font-family:var(--display);font-size:16px;letter-spacing:.02em;color:var(--dim);min-width:58px;text-align:right;}
  .feat.on .price{color:var(--ink);}
  .feat .badge{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(242,176,30,.4);border-radius:5px;padding:2px 6px;}
  .toggle{flex:0 0 44px;height:26px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;transition:background .15s;}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s;}
  .feat.on .toggle{background:var(--accent);border-color:var(--accent);}
  .feat.on .toggle::after{transform:translateX(18px);background:#fff;}

  /* summary bar */
  #bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:760px;z-index:30;
    background:rgba(20,20,23,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  #bar .tot{flex:1;min-width:150px;}
  #bar .tot .lbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  #bar .tot .amt{font-family:var(--display);font-size:24px;letter-spacing:.02em;}
  #bar .tot .amt small{font-family:var(--body);font-size:10.5px;color:var(--muted);font-weight:600;display:block;letter-spacing:0;}
  #bar .comm{min-width:150px;padding:8px 14px;border:1px solid rgba(76,194,107,.4);border-radius:12px;background:rgba(76,194,107,.08);}
  #bar .comm .lbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ok);font-weight:700;}
  #bar .comm .amt{font-family:var(--display);font-size:22px;color:var(--ok);letter-spacing:.02em;}
  #bar button.copy{background:var(--accent);color:#fff;font-weight:700;border-radius:11px;padding:12px 18px;font-size:14px;}
  #bar button.copy.done{background:var(--ok);}

  .disclaimer{color:var(--muted);font-size:11.5px;margin-top:22px;line-height:1.5;border-top:1px solid var(--line);padding-top:14px;}
</style>
</head>
<body>

<!-- ===================== LOGIN GATE ===================== -->
<div id="login">
  <div class="login-card">
    <div class="brand"><span class="dot"></span>Venu</div>
    <div style="margin-top:18px;">
      <div class="kick">Partner portal</div>
      <h1>Sign in to the builder</h1>
      <p class="sub">Package &amp; pricing tool for the Venu team and partners.</p>
    </div>
    <form id="loginForm">
      <div class="fld"><label for="u">Username</label><input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="fld"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
      <button class="go" type="submit">Enter builder</button>
      <div class="err" id="err"></div>
    </form>
    <div class="login-foot"><a href="/">← Back to thevenu.app</a></div>
  </div>
</div>

<!-- ===================== BUILDER APP ===================== -->
<div id="app">
  <header class="top">
    <div class="brand" style="font-size:24px;"><span class="dot"></span>Venu Builder</div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="who">Signed in as <b id="whoName"></b><span class="role" id="whoRole"></span></div>
      <button class="out" onclick="logout()">Log out</button>
    </div>
  </header>

  <div class="field-row">
    <div class="field full"><label>Client / event name</label><input type="text" id="clientName" placeholder="e.g. Aurora Rooftop Launch"></div>
  </div>

  <h2 class="sec">Event type</h2>
  <p class="sec-note">Pick a template to pre-select a starting package. Everything stays editable below.</p>
  <div class="grid2" id="templates"></div>

  <div id="featureList"></div>

  <p class="disclaimer" id="disclaimer"></p>
</div>

<div id="bar" style="display:none;">
  <div class="tot">
    <div class="lbl">Package total</div>
    <div class="amt" id="totAmt">$0 <small id="totNote"></small></div>
  </div>
  <div class="comm" id="commBox">
    <div class="lbl" id="commLbl">Your commission</div>
    <div class="amt" id="commAmt">$0</div>
  </div>
  <button class="copy" id="copyBtn" onclick="copyProposal()">Copy proposal</button>
</div>

<script>
/* =========================================================================
   ACCESS — client-side gate (MVP). NOTE: passwords are visible in page
   source; this is obscurity, not real security. Move to Firebase Auth
   before relying on this for anything sensitive.
   ========================================================================= */
const USERS = {
  michael:  { pw:"michael",  role:"owner",     name:"Michael",  rate:0 },
  patrick:  { pw:"patric",   role:"affiliate", name:"Patrick",  rate:0.10 },
  aaron:    { pw:"aaron",    role:"affiliate", name:"Aaron",    rate:0.10 },
  kristina: { pw:"kristina", role:"affiliate", name:"Kristina", rate:0.10 },
  maureen:  { pw:"maureen",  role:"affiliate", name:"Maureen",  rate:0.10 },
};
const OWNER_AFFILIATE_RATE = 0.10; // rate the owner sees as reference

let currentUser = null;

/* =========================================================================
   PRICING REGISTRY — placeholder prices. Set real numbers here.
   price = one-time per event. requires[] = dependency ids.
   fits[] = pre-selected for these event templates.
   ========================================================================= */
const BASE_PLATFORM = 500; // per-event base: hosting, branding, setup
const REGISTRY = [
  { id:"schedule",  cat:"Core", name:"Schedule & agenda", ds:"Multi-day agenda + live 'now'", price:250, requires:[], fits:["conference","tradeshow","gala","arena","wedding"] },
  { id:"speakers",  cat:"Core", name:"Speaker profiles", ds:"Bios, photos, session links", price:150, requires:["schedule"], fits:["conference","tradeshow"] },
  { id:"announce",  cat:"Core", name:"Announcements", ds:"Banner updates to every phone", price:200, requires:[], fits:["conference","tradeshow","gala","arena","wedding"] },
  { id:"venueMap",  cat:"Core", name:"Venue map + search", ds:"Interactive floor plan w/ search", price:300, requires:[], fits:["tradeshow","conference","arena"] },
  { id:"geofence",  cat:"Core", name:"Geo-fenced alerts", ds:"Location-triggered messages", price:350, requires:[], fits:["conference","tradeshow","arena","wedding"] },

  { id:"profiles",  cat:"Networking", name:"Attendee directory", ds:"Opt-in searchable profiles", price:400, requires:[], fits:["conference","tradeshow"] },
  { id:"connect",   cat:"Networking", name:"Tap-to-connect cards", ds:"QR digital card swap", price:350, requires:["profiles"], fits:["conference","tradeshow"] },
  { id:"meetups",   cat:"Networking", name:"Meetups & groups", ds:"RSVP boards", price:250, requires:["profiles"], fits:["conference"] },

  { id:"photoWall", cat:"Engagement", name:"Photo wall / fan cam", ds:"Attendee photos to big screen", price:600, requires:["moderation"], fits:["conference","gala","arena","wedding"] },
  { id:"geoPhoto",  cat:"Engagement", name:"Geo-fenced photo ops", ds:"Branded filters at set spots", price:400, requires:["photoWall"], fits:["arena","wedding"] },
  { id:"qa",        cat:"Engagement", name:"Live Q&A", ds:"Moderated audience questions", price:350, requires:["moderation"], fits:["conference"] },
  { id:"polls",     cat:"Engagement", name:"Live polls", ds:"Real-time big-screen results", price:300, requires:[], fits:["conference","arena"] },
  { id:"trivia",    cat:"Engagement", name:"Trivia / games", ds:"Timed rounds + leaderboard", price:450, requires:[], fits:["arena","gala"] },
  { id:"scavenger", cat:"Engagement", name:"Scavenger hunt", ds:"QR checkpoints + points", price:550, requires:[], fits:["tradeshow","conference","arena"] },
  { id:"lightShow", cat:"Engagement", name:"Screen light show", ds:"Synced phone-screen effects", price:500, requires:[], fits:["arena"] },
  { id:"lyrics",    cat:"Engagement", name:"Singalong lyrics", ds:"Cued lyrics + artist pack", price:450, requires:[], fits:["arena"] },
  { id:"raffle",    cat:"Engagement", name:"Raffle / prize drawing", ds:"App entries + live spinner", price:400, requires:[], fits:["gala","tradeshow","arena","conference"] },
  { id:"mic",       cat:"Engagement", name:"Audience mic (roadmap)", ds:"Phone-as-mic — hardware", price:0, requires:["moderation"], fits:[], roadmap:true },

  { id:"sponsors",  cat:"Revenue", name:"Sponsor spotlight", ds:"Tiered placements + booths", price:400, requires:[], fits:["conference","tradeshow","arena"] },
  { id:"leadCap",   cat:"Revenue", name:"Sponsor lead capture", ds:"Booth opt-in + CSV export", price:500, requires:["sponsors"], fits:["tradeshow"] },
  { id:"offers",    cat:"Revenue", name:"In-app offers", ds:"Promo codes + flash deals", price:250, requires:["sponsors"], fits:["tradeshow","arena"] },
  { id:"vendors",   cat:"Revenue", name:"Vendor hub", ds:"Self-serve vendor pages", price:600, requires:["moderation"], fits:["tradeshow","arena"] },
  { id:"tickets",   cat:"Revenue", name:"Tickets & VIP badges", ds:"Digital tickets + VIP tiers", price:450, requires:[], fits:["arena","conference","tradeshow"] },
  { id:"merch",     cat:"Revenue", name:"Merch store", ds:"In-seat browse + pickup", price:500, requires:[], fits:["arena","conference"] },
  { id:"food",      cat:"Revenue", name:"Food & trucks", ds:"Vendor map + menus", price:350, requires:[], fits:["arena","tradeshow","gala"] },
  { id:"donate",    cat:"Revenue", name:"Giving / pledge", ds:"Donation CTA + goal tracker", price:350, requires:[], fits:["gala"] },
  { id:"auction",   cat:"Revenue", name:"Live auction", ds:"Real-time bidding + leaderboard", price:500, requires:[], fits:["gala"] },

  { id:"splash",    cat:"Branding", name:"Custom splash screen", ds:"Designed launch moment", price:250, requires:[], fits:[] },
  { id:"domain",    cat:"Branding", name:"Custom domain", ds:"app.theirevent.com", price:150, requires:[], fits:[] },

  { id:"moderation",cat:"Operations", name:"Moderation dashboard", ds:"Approve/reject queue", price:300, requires:[], fits:["conference","gala","arena","wedding"] },
  { id:"bigScreen", cat:"Operations", name:"Big screen display", ds:"AV-ready rotation URL", price:250, requires:[], fits:["conference","gala","arena","wedding"] },
  { id:"qrKit",     cat:"Operations", name:"QR launch kit", ds:"Print-ready QR codes", price:100, requires:[], fits:["conference","tradeshow","gala","arena","wedding"] },
  { id:"analytics", cat:"Operations", name:"Post-event analytics", ds:"Engagement report", price:300, requires:[], fits:["conference","tradeshow"] },
];
const TEMPLATES = [
  { id:"conference", nm:"Conference / Summit", ds:"Keynotes, sessions, expo" },
  { id:"tradeshow",  nm:"Trade show", ds:"Booths, leads, sponsors" },
  { id:"gala",       nm:"Gala / fundraiser", ds:"Auction, giving, program" },
  { id:"wedding",    nm:"Wedding", ds:"Timeline, photo wall, dance floor" },
  { id:"arena",      nm:"Arena / entertainment", ds:"Fan cam, tickets, effects" },
];

let activeTemplate = null;
let selected = new Set();

/* ---------- login ---------- */
function tryRestore(){
  try{ const u = sessionStorage.getItem("venuBuilderUser"); if(u && USERS[u]){ enter(u); } }catch(e){}
}
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  const u = document.getElementById("u").value.trim().toLowerCase();
  const p = document.getElementById("p").value;
  const rec = USERS[u];
  if(rec && p === rec.pw){
    try{ sessionStorage.setItem("venuBuilderUser", u); }catch(e){}
    enter(u);
  } else {
    document.getElementById("err").textContent = "Incorrect username or password.";
  }
});
function enter(u){
  currentUser = { id:u, ...USERS[u] };
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("bar").style.display = "flex";
  document.getElementById("whoName").textContent = currentUser.name;
  document.getElementById("whoRole").textContent = currentUser.role;
  // commission box only for affiliates (owner sees reference payout)
  document.getElementById("commLbl").textContent = currentUser.role === "owner" ? "Affiliate payout (ref)" : "Your commission";
  const rate = currentUser.role === "owner" ? OWNER_AFFILIATE_RATE : currentUser.rate;
  document.getElementById("disclaimer").innerHTML =
    "Prices are placeholders — set real numbers in the registry. " +
    (currentUser.role === "owner"
      ? "Affiliate payout shown at "+(OWNER_AFFILIATE_RATE*100)+"% for reference."
      : "Your commission is "+(rate*100)+"% of the package total, confirmed on signed contracts.");
  renderTemplates();
  renderFeatures();
}
function logout(){
  try{ sessionStorage.removeItem("venuBuilderUser"); }catch(e){}
  currentUser = null; selected = new Set(); activeTemplate = null;
  document.getElementById("app").style.display = "none";
  document.getElementById("bar").style.display = "none";
  document.getElementById("login").style.display = "grid";
  document.getElementById("p").value = ""; document.getElementById("err").textContent = "";
}

/* ---------- templates ---------- */
function renderTemplates(){
  const w = document.getElementById("templates");
  w.innerHTML = TEMPLATES.map(t=>`<button class="tpl" id="tpl-${t.id}" onclick="applyTemplate('${t.id}')">
    <div class="nm">${t.nm}</div><div class="ds">${t.ds}</div></button>`).join("");
}
function applyTemplate(id){
  activeTemplate = id;
  document.querySelectorAll(".tpl").forEach(x=>x.classList.remove("active"));
  document.getElementById("tpl-"+id).classList.add("active");
  selected = new Set(REGISTRY.filter(f=>f.fits.includes(id)).map(f=>f.id));
  resolveDeps();
  renderFeatures();
}

/* ---------- dependency resolution ---------- */
function resolveDeps(){
  let changed = true;
  while(changed){ changed = false;
    for(const f of REGISTRY){ if(selected.has(f.id)){
      for(const d of f.requires){ if(!selected.has(d)){ selected.add(d); changed = true; } }
    }}
  }
}
function dependentsOf(id){ return REGISTRY.filter(f=>selected.has(f.id) && f.requires.includes(id)).map(f=>f.name); }

/* ---------- features ---------- */
function renderFeatures(){
  const w = document.getElementById("featureList");
  const cats = [...new Set(REGISTRY.map(f=>f.cat))];
  w.innerHTML = cats.map(cat=>`
    <div class="cat-h">${cat}</div>
    ${REGISTRY.filter(f=>f.cat===cat).map(f=>{
      const on = selected.has(f.id), rm = !!f.roadmap;
      const deps = f.requires.map(r=>REGISTRY.find(x=>x.id===r).name).join(", ");
      return `<div class="feat ${on?"on":""} ${rm?"locked":""}" ${rm?"":`onclick="toggleFeat('${f.id}')"`}>
        <div class="info"><div class="nm">${f.name}</div><div class="ds">${f.ds}${deps?" · needs "+deps:""}</div></div>
        ${rm?`<span class="badge">Roadmap</span>`:`<div class="price">$${f.price}</div><div class="toggle"></div>`}
      </div>`;
    }).join("")}`).join("");
  renderTotals();
}
function toggleFeat(id){
  if(selected.has(id)){
    const deps = dependentsOf(id);
    if(deps.length){ alert("Turn off "+deps.join(", ")+" first — they depend on this."); return; }
    selected.delete(id);
  } else { selected.add(id); resolveDeps(); }
  renderFeatures();
}

/* ---------- totals + commission ---------- */
function totals(){
  let oneTime = BASE_PLATFORM;
  for(const f of REGISTRY) if(selected.has(f.id)) oneTime += f.price;
  const rate = currentUser ? (currentUser.role==="owner" ? OWNER_AFFILIATE_RATE : currentUser.rate) : 0;
  return { oneTime, commission: Math.round(oneTime * rate), rate };
}
function renderTotals(){
  const t = totals();
  document.getElementById("totAmt").firstChild.textContent = "$"+t.oneTime.toLocaleString()+" ";
  document.getElementById("totNote").textContent = "per event · incl. $"+BASE_PLATFORM+" base";
  document.getElementById("commAmt").textContent = "$"+t.commission.toLocaleString();
}

/* ---------- proposal ---------- */
function buildProposal(){
  const t = totals();
  const name = document.getElementById("clientName").value || "Untitled event";
  const lines = REGISTRY.filter(f=>selected.has(f.id)).map(f=>`  • ${f.name} — $${f.price}`).join("\n");
  let out = `VENU — EVENT APP PROPOSAL
Client / event: ${name}
Template: ${activeTemplate ? (TEMPLATES.find(x=>x.id===activeTemplate)||{}).nm||"—" : "Custom"}

Included:
${lines || "  (none selected)"}

Platform base (branding, hosting, setup): $${BASE_PLATFORM}
------------------------------------------
Total per event: $${t.oneTime.toLocaleString()}

Delivery: branded web app (add to home screen, no download),
moderator dashboard, and AV-ready big-screen display.`;
  if(currentUser && currentUser.role === "affiliate"){
    out += `\n\n— Partner: ${currentUser.name} · Commission (${t.rate*100}%): $${t.commission.toLocaleString()}`;
  }
  return out;
}
async function copyProposal(){
  try{
    await navigator.clipboard.writeText(buildProposal());
    const b = document.getElementById("copyBtn"); b.classList.add("done"); b.textContent = "Copied ✓";
    setTimeout(()=>{ b.classList.remove("done"); b.textContent = "Copy proposal"; }, 1800);
  }catch(e){ alert(buildProposal()); }
}

tryRestore();
</script>
</body>
</html>
